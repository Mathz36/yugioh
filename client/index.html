<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yu-Gi-Oh! Classic Duel - Reino dos Duelistas</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cardNormal: '#c49856',
              cardSpell: '#1d9e74',
              cardTrap: '#bc2e67',
              playmatBorder: '#3b2d54',
            },
          },
        },
      };
    </script>
    <style>
      /* Efeito 3D Holográfico com Profundidade e Sombra Suave */
      .card-3d {
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
        transform-style: preserve-3d;
        perspective: 1000px;
      }
      .card-3d:hover {
        transform: translateY(-8px) scale(1.06) rotateX(4deg) rotateY(-2deg);
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.9), 0 0 25px rgba(245, 158, 11, 0.6);
        z-index: 40;
      }
      .card-3d-defense {
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
        transform-style: preserve-3d;
        perspective: 1000px;
      }
      .card-3d-defense:hover {
        transform: translateY(-8px) scale(1.05);
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.9), 0 0 25px rgba(59, 130, 246, 0.6);
        z-index: 40;
      }
      .zone-empty {
        background: radial-gradient(circle at center, rgba(30, 20, 50, 0.4) 0%, rgba(10, 6, 20, 0.8) 100%);
      }

      /* 1. Posicionamento de Cartas com impacto EaseOutBack */
      @keyframes cardSlamImpact {
        0% {
          transform: translateY(120px) scale(1.35) rotateX(15deg);
          opacity: 0.6;
        }
        70% {
          transform: translateY(-8px) scale(0.97) rotateX(-4deg);
          opacity: 1;
        }
        100% {
          transform: translateY(0) scale(1) rotateX(0deg);
          opacity: 1;
        }
      }
      .anim-card-slam {
        animation: cardSlamImpact 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* 1b. Anel de poeira e impacto visual */
      @keyframes impactRingVFX {
        0% {
          transform: scale(0.4);
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.9);
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
          box-shadow: 0 0 35px 25px rgba(245, 158, 11, 0);
        }
      }
      .anim-impact-ring {
        animation: impactRingVFX 0.5s ease-out forwards;
      }

      /* 2. Compra de Cartas com fluxo orgânico */
      @keyframes drawBezierFlow {
        0% {
          transform: translate(160px, -80px) rotate(15deg) scale(0.5);
          opacity: 0;
        }
        60% {
          transform: translate(-10px, -20px) rotate(-4deg) scale(1.1);
          opacity: 0.95;
        }
        100% {
          transform: translate(0, 0) rotate(0deg) scale(1);
          opacity: 1;
        }
      }
      .anim-draw-card {
        animation: drawBezierFlow 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      /* 3. Ataque: Investida Rápida (Lunge) */
      @keyframes attackLungePlayer {
        0% { transform: translateY(0) scale(1); }
        35% { transform: translateY(-75px) scale(1.18); box-shadow: 0 0 35px rgba(239, 68, 68, 0.9); }
        100% { transform: translateY(0) scale(1); }
      }
      .anim-attack-lunge-player {
        animation: attackLungePlayer 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes attackLungeOpponent {
        0% { transform: translateY(0) scale(1); }
        35% { transform: translateY(75px) scale(1.18); box-shadow: 0 0 35px rgba(239, 68, 68, 0.9); }
        100% { transform: translateY(0) scale(1); }
      }
      .anim-attack-lunge-opponent {
        animation: attackLungeOpponent 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* 3b. Camera Shake */
      @keyframes cameraShakeVFX {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-6px, 5px) rotate(-0.5deg); }
        40% { transform: translate(5px, -4px) rotate(0.4deg); }
        60% { transform: translate(-4px, 3px); }
        80% { transform: translate(3px, -2px); }
        100% { transform: translate(0, 0); }
      }
      .anim-camera-shake {
        animation: cameraShakeVFX 0.28s ease-in-out forwards;
      }

      /* 3c. Floating Damage Text */
      @keyframes damageFloatText {
        0% {
          transform: translateY(0) scale(0.6);
          opacity: 0;
        }
        25% {
          transform: translateY(-15px) scale(1.4);
          opacity: 1;
        }
        80% {
          transform: translateY(-40px) scale(1.1);
          opacity: 0.9;
        }
        100% {
          transform: translateY(-60px) scale(0.9);
          opacity: 0;
        }
      }
      .anim-damage-float {
        animation: damageFloatText 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      }

      /* 4. Destruição: Dissolve, Tremor e Desintegração */
      @keyframes destroyDissolve {
        0% {
          transform: scale(1) rotate(0deg);
          filter: brightness(1.8) contrast(1.5);
          opacity: 1;
        }
        25% {
          transform: scale(1.12) translate(-4px, 3px) rotate(-3deg);
          filter: drop-shadow(0 0 25px rgba(239, 68, 68, 1)) brightness(2.2);
        }
        50% {
          transform: scale(0.9) translate(4px, -3px) rotate(3deg);
          opacity: 0.8;
          filter: blur(2px) brightness(1.5);
        }
        100% {
          transform: scale(0.1) rotate(12deg);
          opacity: 0;
          filter: blur(8px) brightness(0.2);
        }
      }
      .anim-card-destroy {
        animation: destroyDissolve 0.55s ease-in forwards;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
